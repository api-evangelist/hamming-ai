name: Hamming AI
kind: company
description: Hamming AI is a testing, evaluation, and observability platform for voice
  and LLM AI agents. Its REST API runs experiments and voice/call test runs against
  your agents, manages datasets, registers custom scorers and evaluations, and ingests
  traces, logs, and production call logs for monitoring. A prompt optimizer and
  registry round out the platform.
