meters:
- name: voice_test_calls
  description: Simulated voice/call test calls placed against agents during test runs.
  unit: calls
  aggregation: sum
  dimensions:
  - account
  - agent
  - experiment
- name: experiment_runs
  description: Experiment / evaluation runs executed over datasets.
  unit: runs
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: evaluation_items
  description: Experiment items (per dataset item) evaluated and scored.
  unit: items
  aggregation: sum
  dimensions:
  - account
  - experiment
- name: monitored_calls
  description: Production call logs ingested for monitoring and scoring.
  unit: calls
  aggregation: sum
  dimensions:
  - account
  - agent
- name: traces
  description: Trace events ingested from instrumented agents.
  unit: traces
  aggregation: sum
  dimensions:
  - account
  - agent
principles:
- name: Visibility
  description: Track voice test-call volume, experiment runs, and monitored-call volume against the plan's included amounts.
- name: Allocation
  description: Tag experiments and API keys per agent/team to map spend to internal cost centers.
- name: Optimization
  description: Scope datasets to high-value scenarios, reuse golden datasets, and right-size concurrency for load tests to control cost.
- name: Accountability
  description: Assign owners per agent/project; review test-run and monitoring volume against the negotiated plan.
maintainers:
