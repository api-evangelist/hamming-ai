description: >-
  FinOps view of Hamming AI spend. Hamming sells voice/LLM agent testing,
  evaluation, and observability through volume-based, sales-led plans rather
  than published per-unit rates. Cost drivers are primarily voice/call test
  volume (number and concurrency of simulated calls), experiment/evaluation
  runs, and production monitoring volume. Per-unit prices are not published, so
  this artifact is not reconciled.
notes: >-
  No public price list exists; map spend to the negotiated plan. Verify the
  billable units (calls, test runs, monitored calls, seats) and rates with
  Hamming during reconciliation.
sources:
- https://hamming.ai/
